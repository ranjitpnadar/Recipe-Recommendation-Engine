version: "3.9"

services:
  rag_service:
    build: .
    container_name: rag_service
    ports:
      - "8000:8000"
    volumes:
      - .:/app   # optional: mount local code for live reload
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
